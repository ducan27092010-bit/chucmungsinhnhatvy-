
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #26052e;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<iframe
    id="birthdayFrame"
    name="birthdayFrame"
    src="index.html">
</iframe>

<script>
function startMusic() {
    const music = document.getElementById("bgMusic");

    music.play().catch(error => {
        console.log("Lỗi phát nhạc:", error);
    });
}
</script>

</body>
</html>
